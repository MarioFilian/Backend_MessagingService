version: '3.9'

services:
  redis:
    image: redis:7.4
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--save", "60", "1",
        "--loglevel", "warning"
      ]
    restart: unless-stopped
