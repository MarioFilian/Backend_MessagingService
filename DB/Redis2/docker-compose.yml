version: '3.9'

services:
  redis:
    image: redis:7.4
    container_name: redis-container2
    ports:
      - "${REDIS_PORT}:6379"  # 👈 Puerto externo configurable
    volumes:
      - ./redis_data:/data
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--save", "60", "1",
        "--loglevel", "warning"
      ]
    restart: unless-stopped
