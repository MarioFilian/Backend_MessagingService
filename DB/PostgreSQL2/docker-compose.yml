version: '3.9'

services:
  postgresql:
    image: postgres:latest
    container_name: postgresql2
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
