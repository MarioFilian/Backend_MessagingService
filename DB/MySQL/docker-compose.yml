version: '3.9'

services:
  mysql:
    image: mysql
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"  # Puerto externo configurable por variable
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped
