# dev-redis.yml
name: 🧪 Dev · Redis

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/Redis/**'
      - '.github/workflows/dev-redis.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/Redis/**'
      - '.github/workflows/dev-redis.yml'


jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REDIS_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            mkdir -p /home/${{ secrets.USER_UBUNTU }}/redis-deploy

      - name: Copy Redis files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REDIS_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          source: "DB/Redis/docker-compose.yml"
          target: /home/${{ secrets.USER_UBUNTU }}/redis-deploy
          debug: true

      - name: Deploy Redis on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REDIS_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          envs: REDIS_PASSWORD
          script: |
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose
            cd /home/${{ secrets.USER_UBUNTU }}/redis-deploy/DB/Redis
            REDIS_PASSWORD=$REDIS_PASSWORD sudo -E docker-compose down || true
            REDIS_PASSWORD=$REDIS_PASSWORD sudo -E docker-compose up -d
            sudo docker ps
