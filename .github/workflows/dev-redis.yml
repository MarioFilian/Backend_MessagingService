# dev-redis.yml
name: 🧪 Dev · Redis

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/Redis/**'
      - '.github/workflows/dev-redis.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/Redis/**'
      - '.github/workflows/dev-redis.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REDIS_PASSWORD: ${{ secrets.PASS_DB }}
      REDIS_PORT: ${{ secrets.PORT_REDIS1 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: mkdir -p /home/${{ secrets.EC2_USER }}/redis-deploy

      - name: Copy Redis files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          source: "DB/Redis/docker-compose.yml"
          target: /home/${{ secrets.EC2_USER }}/redis-deploy
          debug: true

      - name: Install Docker and Docker Compose if not present
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            # Verifica si Docker está instalado
            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "✅ Docker ya está instalado."
            fi

            if ! docker compose version &> /dev/null; then
              echo "🔧 Instalando Docker Compose plugin..."
              sudo apt-get install -y docker-compose-plugin || sudo apt-get install -y docker-compose
            else
              echo "✅ Docker Compose ya está instalado."
            fi

      - name: Deploy Redis on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          envs: REDIS_PASSWORD,REDIS_PORT
          script: |
            cd /home/${{ secrets.EC2_USER }}/redis-deploy/DB/Redis

            # Limpiar contenedores previos
            CONTAINERS=$(sudo docker ps -a --filter "name=redis-container" -q)
            if [ -n "$CONTAINERS" ]; then
              echo "🧹 Deteniendo contenedores redis existentes..."
              sudo docker stop $CONTAINERS || true
              echo "🗑️ Eliminando contenedores redis existentes..."
              sudo docker rm $CONTAINERS || true
            else
              echo "✅ No se encontraron contenedores redis para detener/eliminar."
            fi

            # Despliegue
            REDIS_PASSWORD=$REDIS_PASSWORD REDIS_PORT=$REDIS_PORT sudo -E docker compose up -d
            echo "🔍 Contenedores activos:"
            sudo docker ps
