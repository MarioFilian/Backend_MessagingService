name: 🔧 Dev · Forgot Password Service

on:
  push:
    branches: ["development"]
    paths:
      - 'Auth/forgot-password-service/**'
      - '.github/workflows/dev-forgot-password.yml'

  pull_request:
    branches: ["QA"]
    paths:
      - 'Auth/forgot-password-service/**'
      - '.github/workflows/dev-forgot-password.yml'

jobs:
  test:
    name: ✅ Run Dart Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auth/forgot-password-service

    steps:
      - name: 📅 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install dependencies
        run: dart pub get

      - name: 🧪 Run tests
        run: dart test --reporter=expanded

  cd:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: Auth/forgot-password-service

    steps:
      - name: 📅 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AUTH_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            set -e

            IMAGE=${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest
            CONTAINER=forgot-password-service

            echo "🔍 Checking Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🔧 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "✅ Docker already installed."
            fi

            echo "📥 Pulling latest image..."
            sudo docker pull $IMAGE

            echo "🧹 Cleaning old container..."
            if sudo docker ps -a --format '{{.Names}}' | grep -q $CONTAINER; then
              sudo docker stop $CONTAINER || true
              sudo docker rm $CONTAINER || true
            fi

            echo "🐳 Deploying container..."
            sudo docker run -d --name $CONTAINER -p ${{ secrets.PORT_FORGOTPASS }}:${{ secrets.PORT_FORGOTPASS }} \
              -e DB_HOST=${{ secrets.EC2_BD_DEV }} \
              -e DB_PORT=${{ secrets.PORT_POSTGRES1 }} \
              -e DB_NAME=${{ secrets.DB_POSTGRES }} \
              -e DB_USER=${{ secrets.USER_POSTGRES }} \
              -e DB_PASSWORD=${{ secrets.PASS_DB }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }} \
              -e JWT_REFRESH_EXPIRATION_MS=${{ secrets.JWT_REFRESH_EXPIRATION_MS }} \
              $IMAGE

