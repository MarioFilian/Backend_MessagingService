# prod-registration-service.yml
name: 🚀 Prod · Registration Service

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Auth/registration-service/**'
      - '.github/workflows/prod-registration-service.yml'

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build .jar file (Skip tests)
        run: mvn clean install -DskipTests -f Auth/registration-service/pom.xml

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build Auth/registration-service/. --file Auth/registration-service/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/registration-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/registration-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/registration-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/registration-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_REGISTRATION }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Instalar Docker si no está presente (Ubuntu-compatible)
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker on Ubuntu"
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo usermod -aG docker $USER
              sudo systemctl start docker
            fi

            # Crear archivo .env temporal
            ENV_PATH=~/registration-service.env
            echo "APP_NAME=${{ secrets.APP_NAME }}" > $ENV_PATH
            echo "SERVER_PORT=${{ secrets.SERVER_PORT_REGISTRATION }}" >> $ENV_PATH
            echo "DB_URL=${{ secrets.DB_URL }}" >> $ENV_PATH
            echo "DB_USERNAME=${{ secrets.POSTGRES_USER }}" >> $ENV_PATH
            echo "DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> $ENV_PATH
            echo "HIBERNATE_DDL_AUTO=${{ secrets.HIBERNATE_DDL_AUTO }}" >> $ENV_PATH
            echo "SHOW_SQL=${{ secrets.SHOW_SQL }}" >> $ENV_PATH
            echo "HIBERNATE_DIALECT=${{ secrets.HIBERNATE_DIALECT }}" >> $ENV_PATH
            echo "LOGGING_LEVEL_HIBERNATE_SQL=${{ secrets.LOGGING_LEVEL_HIBERNATE_SQL }}" >> $ENV_PATH
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $ENV_PATH
            echo "JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }}" >> $ENV_PATH
            echo "JWT_REFRESH_EXPIRATION_MS=${{ secrets.JWT_REFRESH_EXPIRATION_MS }}" >> $ENV_PATH
            echo "CORS_ALLOWED=${{ secrets.CORS_ALLOWED }}" >> $ENV_PATH
            echo "HOST_REDIS=${{ secrets.REDIS_HOST }}" >> $ENV_PATH
            echo "PORT_REDIS=${{ secrets.REDIS_PORT }}" >> $ENV_PATH
            echo "PASS_REDIS=${{ secrets.REDIS_PASSWORD }}" >> $ENV_PATH

            # Eliminar imagen vieja
            sudo docker image prune -f

            # Pull de imagen
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/registration-service:latest

            # Detener contenedor anterior si existe
            if [ $(sudo docker ps -aq -f name=registration-service) ]; then
              echo "==> Stopping and removing existing container"
              sudo docker stop registration-service
              sudo docker rm registration-service
            fi

            # Ejecutar nuevo contenedor
            echo "==> Starting new container"
            sudo docker run -d --name registration-service \
              --env-file $ENV_PATH \
              -p 3002:${{ secrets.SERVER_PORT_REGISTRATION }} \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/registration-service:latest

            # Verificar contenedor
            if sudo docker ps -f name=registration-service | grep registration-service; then
              echo "✅ Container started successfully"
              rm -f $ENV_PATH
            else
              echo "❌ Failed to start the container"
              exit 1
            fi
