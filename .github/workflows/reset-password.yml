name: CI/CD for Reset Password Service

on:
  push:
    paths:
      - 'Auth/reset-password-service/**'
      - '.github/workflows/reset-password.yml'
    branches: [ "development" ]
  pull_request:
    paths:
      - 'Auth/reset-password-service/**'
      - '.github/workflows/reset-password.yml'
    branches: [ "QA", "main" ]

jobs:
  cd:
    name: 🚀 Deploy Reset Password Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auth/reset-password-service
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/reset-password-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/reset-password-service:latest

          rm .env

          docker push ${{ secrets.DOCKER_USERNAME }}/reset-password-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/reset-password-service:latest

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_RESET_PASSWORD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY2 }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "🚧 Docker no está instalado. Instalando Docker..."

              while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "🔒 Esperando que se libere el lock de apt..."
                sleep 5
              done

              sudo rm -f /var/lib/apt/lists/lock
              sudo rm -f /var/lib/dpkg/lock*
              sudo dpkg --configure -a

              sudo apt-get update
              sudo apt-get install -y \
                apt-transport-https \
                ca-certificates \
                curl \
                gnupg \
                software-properties-common

              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg

              echo \
                "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            else
              echo "✅ Docker ya está instalado"
            fi

            echo "🐳 Desplegando contenedor..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/reset-password-service:latest
            sudo docker stop reset-password-service || true
            sudo docker rm reset-password-service || true
            sudo docker run -d --name reset-password-service -p ${{ secrets.PORT_RESET_PASSWORD }}:3007 \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/reset-password-service:latest
