# dev-validate-service.yml
name: 🔧 Dev · Validate Service

on:
  push:
    branches: [ "development" ]
    paths:
      - 'Auth/validate-service/**'
      - '.github/workflows/dev-validate-service.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'Auth/validate-service/**'
      - '.github/workflows/dev-validate-service.yml'

jobs:
  ci:
    name: ⚙️ Run CI
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_ENV: prod
      APP_DEBUG: 0
    defaults:
      run:
        working-directory: Auth/validate-service
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, intl, zip
          tools: composer

      - name: 🔧 Create minimal .env file
        run: echo "APP_ENV=prod" > .env

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 🧹 Remove .env file
        run: rm -f .env

      - name: ✅ Validate composer.json
        run: composer validate --strict

      - name: 🧪 PHP Syntax Check
        run: find src/ -type f -name "*.php" -exec php -l {} \;

  cd:
    name: 🚀 Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APP_ENV: prod
      APP_DEBUG: 0
    defaults:
      run:
        working-directory: Auth/validate-service
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/auth-validate-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/auth-validate-service:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/auth-validate-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-validate-service:latest

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AUTH_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            set -e

            IMAGE=${{ secrets.DOCKER_USERNAME }}/auth-validate-service:latest
            CONTAINER=auth-validate-service

            echo "🔍 Checking Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🔧 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "✅ Docker already installed."
            fi

            echo "📥 Pulling latest image..."
            sudo docker pull $IMAGE

            echo "🧹 Cleaning old container..."
            if sudo docker ps -a --format '{{.Names}}' | grep -q $CONTAINER; then
              sudo docker stop $CONTAINER || true
              sudo docker rm $CONTAINER || true
            fi

            echo "🐳 Deploying container..."
            sudo docker run -d --name $CONTAINER -p ${{ secrets.SERVER_PORT_VALIDATE }}:80 \
              -e APP_ENV=prod \
              -e APP_DEBUG=0 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              $IMAGE
