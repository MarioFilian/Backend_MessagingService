# dev-redis2.yml
name: 🧪 Dev · Redis 2

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/Redis2/**'
      - '.github/workflows/dev-redis2.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/Redis2/**'
      - '.github/workflows/dev-redis2.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REDIS_PASSWORD: ${{ secrets.PASS_DB }}
      REDIS_PORT: ${{ secrets.PORT_REDIS2 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_MC3 }}
          script: mkdir -p /home/${{ secrets.EC2_USER }}/redis2-deploy

      - name: Copy Redis files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BD_DEV2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_MC3 }}
          source: "DB/Redis2/docker-compose.yml"
          target: /home/${{ secrets.EC2_USER }}/redis2-deploy
          debug: true

      - name: Install Docker and Docker Compose if not present
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_MC3 }}
          script: |
            # Verifica si Docker está instalado
            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "📦 Instalando Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            else
              echo "✅ Docker ya está instalado."
            fi

            if ! docker compose version &> /dev/null; then
              echo "🔧 Instalando Docker Compose plugin..."
              sudo apt-get install -y docker-compose-plugin || sudo apt-get install -y docker-compose
            else
              echo "✅ Docker Compose ya está instalado."
            fi

      - name: Deploy Redis on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_MC3 }}
          envs: REDIS_PASSWORD,REDIS_PORT
          script: |
            cd /home/${{ secrets.EC2_USER }}/redis2-deploy/DB/Redis2

            # Limpiar contenedores previos
            CONTAINERS=$(sudo docker ps -a --filter "name=redis-container2" -q)
            if [ -n "$CONTAINERS" ]; then
              echo "🧹 Deteniendo contenedores redis 2 existentes..."
              sudo docker stop $CONTAINERS || true
              echo "🗑️ Eliminando contenedores redis 2 existentes..."
              sudo docker rm $CONTAINERS || true
            else
              echo "✅ No se encontraron contenedores redis para detener/eliminar."
            fi

            # Despliegue
            REDIS_PASSWORD=$REDIS_PASSWORD REDIS_PORT=$REDIS_PORT sudo -E docker-compose up -d
            echo "🔍 Contenedores activos:"
            sudo docker ps
