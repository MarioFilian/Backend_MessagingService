name: "🚀 CI/CD: API Gateway Docker Build & Deploy"

on:
  push:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'
    branches: [ "development" ]
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'
    branches: [ "main", "QA" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
      CONTAINER_NAME: api-gateway
      REMOTE_HOST: ${{ secrets.EC2_HOST_API_GATEWAY }}
      REMOTE_USER: ${{ secrets.EC2_USER }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ENV_DIR: /home/${{ secrets.EC2_USER }}/api-gateway
      ENV_PATH: /home/${{ secrets.EC2_USER }}/api-gateway/.env

    steps:
      - name: 📦 Checkout código fuente
        uses: actions/checkout@v4

      - name: 🔐 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Construir y subir imagen del API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: 🧹 Preparar carpeta remota para el despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            rm -rf ${{ env.ENV_DIR }}
            mkdir -p ${{ env.ENV_DIR }}

      - name: 📝 Crear archivo `.env` directamente en el servidor remoto
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cat <<EOF > ${{ env.ENV_PATH }}
            HOST_LOGIN=${{ secrets.EC2_HOST_LOGIN }}
            HOST_REGISTER=${{ secrets.EC2_HOST_REGISTRATION }}
            HOST_VALIDATE=${{ secrets.EC2_HOST_VALIDATE }}
            PORT_LOGIN=${{ secrets.PORT_LOGIN }}
            PORT_REGISTER=${{ secrets.SERVER_PORT_REGISTRATION }}
            PORT_VALIDATE=${{ secrets.SERVER_PORT_VALIDATE }}
            EOF

      - name: 📡 Desplegar y configurar servidor remoto
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/api-gateway:latest"
            CONTAINER_NAME="api-gateway"
            ENV_PATH="${{ env.ENV_PATH }}"

            echo "📦 Verificando instalación de Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🐳 Docker no encontrado. Instalando..."
              sudo apt-get update
              sudo apt-get install -y \
                ca-certificates \
                curl \
                gnupg \
                lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              echo "✅ Docker instalado."
            else
              echo "✅ Docker ya está instalado."
            fi

            echo "🔄 Descargando imagen del API Gateway..."
            sudo docker pull $IMAGE_NAME

            echo "🧼 Eliminando contenedor anterior si existe..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "🚀 Lanzando nuevo contenedor del Gateway..."
            sudo docker run -d \
              --name $CONTAINER_NAME \
              -p 80:3000 \
              --env-file $ENV_PATH \
              $IMAGE_NAME

            echo "✅ Despliegue completo."
