# prod-api-gateway.yml
name: 📦 Prod · API Gateway

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/prod-api-gateway.yml'

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
      CONTAINER_NAME: api-gateway
      REMOTE_HOST: ${{ secrets.EC2_HOST_API_GATEWAY_PROD }}
      REMOTE_USER: ${{ secrets.EC2_USER_PROD }}
      SSH_KEY: ${{ secrets.EC2_SSH_KEY_PROD }}

    steps:
      - name: 📦 Checkout código fuente
        uses: actions/checkout@v4

      - name: 🔐 Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Construir y subir imagen del API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: 📡 Desplegar y configurar servidor remoto
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"

            echo "📦 Verificando instalación de Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🐳 Docker no encontrado. Instalando..."
              sudo apt-get update
              sudo apt-get install -y \
                ca-certificates \
                curl \
                gnupg \
                lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              echo "✅ Docker instalado."
            else
              echo "✅ Docker ya está instalado."
            fi

            echo "🔄 Descargando imagen del API Gateway..."
            sudo docker pull $IMAGE_NAME

            echo "🧼 Eliminando contenedor anterior si existe..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "🚀 Lanzando nuevo contenedor del Gateway..."
            sudo docker run -d \
              --name $CONTAINER_NAME \
              -p 80:3000 \
              -e HOST_LOGIN=${{ secrets.API_GATEWAY_HOST_LOGIN_PROD }} \
              -e HOST_REGISTER=${{ secrets.API_GATEWAY_HOST_REGISTER_PROD }} \
              -e HOST_VALIDATE=${{ secrets.API_GATEWAY_HOST_VALIDATE_PROD }} \
              $IMAGE_NAME

            echo "✅ Despliegue completo."
