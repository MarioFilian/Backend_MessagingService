# prod-profile-update.yml
name: 🚀 Prod · Profile Update Service

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Users/profile-update-service/**'
      - '.github/workflows/prod-profile-update.yml'

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Java Microservice
    runs-on: ubuntu-latest

    steps:
      - name: 🗅️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 📆 Build .jar file (Skip tests)
        run: mvn clean install -DskipTests -f Users/profile-update-service/pom.xml

      - name: 🔐 Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and push Docker image
        run: |
          docker build Users/profile-update-service/. --file Users/profile-update-service/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/profile-update-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/profile-update-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROFILE_UPDATE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY2 }}
          port: 22
          script: |
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker on Ubuntu"
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo usermod -aG docker $USER
              sudo systemctl start docker
            fi

            ENV_PATH=~/profile-update.env
            echo "DB_HOST=${{ secrets.POSTGRES_HOST }}" > $ENV_PATH
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> $ENV_PATH
            echo "DB_USER=${{ secrets.POSTGRES_USER }}" >> $ENV_PATH
            echo "DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> $ENV_PATH
            echo "DB_NAME=${{ secrets.POSTGRES_DB }}" >> $ENV_PATH
            echo "PORT=${{ secrets.PORT_PROFILE_UPDATE }}" >> $ENV_PATH
            echo "HIBERNATE_DDL_AUTO=${{ secrets.HIBERNATE_DDL_AUTO }}" >> $ENV_PATH
            echo "SHOW_SQL=${{ secrets.SHOW_SQL }}" >> $ENV_PATH
            echo "HIBERNATE_DIALECT=${{ secrets.HIBERNATE_DIALECT }}" >> $ENV_PATH

            sudo docker image prune -f
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

            if [ $(sudo docker ps -aq -f name=profile-update-service) ]; then
              echo "==> Stopping and removing existing container"
              sudo docker stop profile-update-service
              sudo docker rm profile-update-service
            fi

            echo "==> Starting new container"
            sudo docker run -d --name profile-update-service \
              --env-file $ENV_PATH \
              -p ${{ secrets.PORT_PROFILE_UPDATE }}:3009 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

            if sudo docker ps -f name=profile-update-service | grep profile-update-service; then
              echo "✅ Container started successfully"
              rm -f $ENV_PATH
            else
              echo "❌ Failed to start the container"
              exit 1
            fi
