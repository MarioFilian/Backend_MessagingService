name: Docker Image CI/CD for Login Service

on:
  push:
    paths:
      - 'Auth/login-service/**'
      - '.github/workflows/login-service-ci-cd.yml'
    branches: [ "development" ]
  pull_request:
    paths:
      - 'Auth/login-service/**'
      - '.github/workflows/login-service-ci-cd.yml'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: Auth/login-service

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build Auth/login-service/. --file Auth/login-service/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/login-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/login-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/login-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/login-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_LOGIN }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Instalar Docker si no está presente
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker"
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker ec2-user
            fi

            # Crear archivo .env
            echo "PORT=${{ secrets.PORT_LOGIN }}" > /home/ec2-user/login-service.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/ec2-user/login-service.env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> /home/ec2-user/login-service.env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> /home/ec2-user/login-service.env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> /home/ec2-user/login-service.env
            echo "DB_HOST=${{ secrets.POSTGRES_HOST }}" >> /home/ec2-user/login-service.env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> /home/ec2-user/login-service.env
            echo "DB_USERNAME=${{ secrets.POSTGRES_USER }}" >> /home/ec2-user/login-service.env
            echo "DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /home/ec2-user/login-service.env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> /home/ec2-user/login-service.env

            # Eliminar imagen vieja
            sudo docker image prune -f

            # Pull de imagen
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/login-service:latest

            # Detener contenedor anterior si existe
            if [ $(sudo docker ps -aq -f name=login-service) ]; then
              echo "==> Stopping and removing existing container"
              sudo docker stop login-service
              sudo docker rm login-service
            fi

            # Ejecutar nuevo contenedor
            echo "==> Starting new container"
            sudo docker run -d --name login-service \
              --env-file /home/ec2-user/login-service.env \
              -p 3001:${{ secrets.PORT_LOGIN }} \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/login-service:latest

            # Verificar que está corriendo
            if sudo docker ps -f name=login-service | grep login-service; then
              echo "✅ Container started successfully"
              rm -f /home/ec2-user/login-service.env
            else
              echo "❌ Failed to start the container"
              exit 1
            fi
