name: Docker Image CI/CD for Login Service

on:
  push:
    paths:
      - 'login-service/**'
    branches: [ "development" ]
  pull_request:
    paths:
      - 'login-service/**'
    branches:
      - "QA"
      - "main"

jobs:
  build-and-deploy:
    name: Build, Push Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: login-service

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build login-service/. --file login-service/Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/login-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/login-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/login-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/login-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_LOGIN }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Instalar Docker si no está presente
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker"
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -a -G docker ec2-user
            fi

            # Crear archivo .env para variables de entorno
            echo "PORT=${{ secrets.PORT_LOGIN }}" > /home/ec2-user/login-service.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/ec2-user/login-service.env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> /home/ec2-user/login-service.env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> /home/ec2-user/login-service.env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> /home/ec2-user/login-service.env

            # Descargar imagen Docker más reciente
            echo "==> Pulling the latest Docker image"
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/login-service:latest

            # Detener y eliminar contenedor previo
            if [ $(sudo docker ps -aq -f name=login-service) ]; then
              echo "==> Stopping and removing existing container"
              sudo docker stop login-service
              sudo docker rm login-service
            fi

            # Ejecutar nuevo contenedor con .env
            echo "==> Starting a new container"
            sudo docker run -d --name login-service -p 3001:${{ secrets.PORT }} \
              --env-file /home/ec2-user/login-service.env \
              ${{ secrets.DOCKER_USERNAME }}/login-service:latest

            # Validar ejecución del contenedor
            if sudo docker ps -f name=login-service | grep login-service; then
              echo "==> Container started successfully"
            else
              echo "==> Failed to start the container. Check Docker logs."
              exit 1
            fi
