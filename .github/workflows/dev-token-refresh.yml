# dev-token-refresh.yml
name: 🔧 Dev · Token Refresh Service

on:
  push:
    branches: [ "development" ]
    paths:
      - 'Auth/token-refresh-service/**'
      - '.github/workflows/dev-token-refresh.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'Auth/token-refresh-service/**'
      - '.github/workflows/dev-token-refresh.yml'

jobs:
  cd:
    name: 🚀 Deploy Token Refresh Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auth/token-refresh-service
    steps:
      - name: 📅 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          echo "PORT=${{ secrets.TOKEN_REFRESH_PORT }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}" >> .env
          echo "JWT_EXP_MINUTES=${{ secrets.JWT_EXP_MINUTES }}" >> .env
          echo "JWT_EXP_DAYS=${{ secrets.JWT_EXP_DAYS }}" >> .env
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest
          rm .env
          docker push ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest
      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_TOKEN_REFRESH }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY2 }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "🚧 Docker no está instalado. Instalando Docker..."
              while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "🔒 Esperando que se libere el lock de apt..."
                sleep 5
              done
              sudo rm -f /var/lib/apt/lists/lock
              sudo rm -f /var/lib/dpkg/lock*
              sudo dpkg --configure -a
              sudo apt-get update
              sudo apt-get install -y \
                apt-transport-https \
                ca-certificates \
                curl \
                gnupg \
                software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo \
                "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            else
              echo "✅ Docker ya está instalado"
            fi
            echo "🐳 Desplegando contenedor..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest
            sudo docker stop token-refresh-service || true
            sudo docker rm token-refresh-service || true
            sudo docker run -d --name token-refresh-service -p ${{ secrets.TOKEN_REFRESH_PORT }}:3003 \
              -e PORT=${{ secrets.TOKEN_REFRESH_PORT }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }} \
              -e JWT_EXP_MINUTES=${{ secrets.JWT_EXP_MINUTES }} \
              -e JWT_EXP_DAYS=${{ secrets.JWT_EXP_DAYS }} \
              -e REDIS_URL=${{ secrets.REDIS_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest