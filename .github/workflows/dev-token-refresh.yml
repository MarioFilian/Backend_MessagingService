# dev-token-refresh.yml
name: 🔧 Dev · Token Refresh Service

on:
  push:
    branches: [ "development" ]
    paths:
      - 'Auth/token-refresh-service/**'
      - '.github/workflows/dev-token-refresh.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'Auth/token-refresh-service/**'
      - '.github/workflows/dev-token-refresh.yml'

jobs:
  cd:
    name: 🚀 Deploy Token Refresh Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auth/token-refresh-service
    steps:
      - name: 📅 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AUTH_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            set -e

            IMAGE=${{ secrets.DOCKER_USERNAME }}/token-refresh-service:latest
            CONTAINER=token-refresh-service

            echo "🔍 Checking Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🔧 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "✅ Docker already installed."
            fi

            echo "📥 Pulling latest image..."
            sudo docker pull $IMAGE

            echo "🧹 Cleaning old container..."
            if sudo docker ps -a --format '{{.Names}}' | grep -q $CONTAINER; then
              sudo docker stop $CONTAINER || true
              sudo docker rm $CONTAINER || true
            fi

            echo "🐳 Deploying container..."
            sudo docker run -d --name $CONTAINER -p ${{ secrets.PORT_TOKENREFRESH }}:${{ secrets.PORT_TOKENREFRESH }} \
              -e PORT=${{ secrets.PORT_TOKENREFRESH }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }} \
              -e JWT_EXP_MINUTES=${{ secrets.JWT_EXP_MINUTES }} \
              -e JWT_EXP_DAYS=${{ secrets.JWT_EXP_DAYS }} \
              -e REDIS_HOST=${{ secrets.EC2_BD_DEV }} \
              -e REDIS_PORT=${{ secrets.PORT_REDIS1 }} \
              -e REDIS_PASSWORD=${{ secrets.PASS_DB }} \
              $IMAGE
