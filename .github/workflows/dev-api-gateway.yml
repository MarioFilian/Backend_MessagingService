# dev-api-gateway.yml
name: 🧪 Dev · API Gateway

on:
  push:
    branches: [ "development" ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/dev-api-gateway.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/dev-api-gateway.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
      CONTAINER_NAME: api-gateway
      REMOTE_HOST: ${{ secrets.EC2_API_GATEWAY }}
      REMOTE_USER: ${{ secrets.EC2_USER }}
      SSH_KEY: ${{ secrets.EC2_KEY_BD }}

    steps:
      - name: 📦 Checkout source code
        uses: actions/checkout@v4

      - name: 🔐 Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: 📡 Deploy & run container remotely without .env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"

            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "Docker already installed."
            fi

            echo "Pulling latest image..."
            sudo docker pull $IMAGE_NAME

            echo "Stopping & removing previous container if exists..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "Running container with environment variables injected directly..."
            sudo docker run -d --name $CONTAINER_NAME \
              -p 80:${{ secrets.PORT_APIGATEWAY }} \
              -e HOST_LOGIN=${{ secrets.EC2_AUTH_DEV }} \
              -e PORT_LOGIN=${{ secrets.PORT_LOGIN }} \
              -e HOST_REGISTER=${{ secrets.EC2_AUTH_DEV }} \
              -e PORT_REGISTER=${{ secrets.PORT_REGISTER }} \
              -e HOST_VALIDATE=${{ secrets.EC2_AUTH_DEV }} \
              -e PORT_VALIDATE=${{ secrets.PORT_VALIDATETOKEN }} \
              $IMAGE_NAME

            echo "Deployment complete."
