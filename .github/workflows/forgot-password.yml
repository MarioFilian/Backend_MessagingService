name: CI/CD for Forgot Password Service

on:
  push:
    paths:
      - 'Auth/forgot-password-service/**'
      - '.github/workflows/forgot-password.yml'
    branches: [ "development" ]
  pull_request:
    paths:
      - 'Auth/forgot-password-service/**'
      - '.github/workflows/forgot-password.yml'
    branches: [ "QA", "main" ]

jobs:
  cd:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Auth/forgot-password-service
    steps:
      - name: 📅 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          echo "DB_HOST=${{ secrets.POSTGRES_HOST }}" > .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.POSTGRES_DB }}" >> .env
          echo "DB_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest

          rm .env

          docker push ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FORGOT_PASSWORD_SERVICE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "🚧 Docker no está instalado. Instalando Docker..."

              # Espera a que se libere el lock si está ocupado
              while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "🔒 Esperando que se libere el lock de apt..."
                sleep 5
              done

              sudo rm -f /var/lib/apt/lists/lock
              sudo rm -f /var/lib/dpkg/lock*
              sudo dpkg --configure -a

              sudo apt-get update
              sudo apt-get install -y \
                apt-transport-https \
                ca-certificates \
                curl \
                gnupg \
                software-properties-common

              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg

              echo \
                "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            else
              echo "✅ Docker ya está instalado"
            fi

            echo "🐳 Desplegando contenedor..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest
            sudo docker stop forgot-password-service || true
            sudo docker rm forgot-password-service || true
            sudo docker run -d --name forgot-password-service -p ${{ secrets.PORT_FORGOTPASS }}:3005 \
              -e DB_HOST=${{ secrets.POSTGRES_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_NAME=${{ secrets.POSTGRES_DB }} \
              -e DB_USER=${{ secrets.POSTGRES_USER }} \
              -e DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/forgot-password-service:latest
