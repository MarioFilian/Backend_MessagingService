name: 🧪 Dev · MySQL

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/MySQL/**'
      - '.github/workflows/dev-mysql.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/MySQL/**'
      - '.github/workflows/dev-mysql.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.USER_MYSQL }}
      MYSQL_PASSWORD: ${{ secrets.PASS_DB }}
      MYSQL_PORT: ${{ secrets.PORT_MYSQL1 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MYSQL_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            mkdir -p /home/${{ secrets.USER_UBUNTU }}/mysql-deploy

      - name: Copy MySQL files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MYSQL_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          source: "DB/MySQL/docker-compose.yml"
          target: /home/${{ secrets.USER_UBUNTU }}/mysql-deploy
          debug: true

      - name: Deploy MySQL on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MYSQL_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          envs: MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_PORT
          script: |
            # Verificar e instalar Docker y Docker Compose si no están presentes
            if ! command -v docker &> /dev/null; then
              echo "⚠️ Docker no encontrado. Instalando..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            else
              echo "✅ Docker ya instalado."
            fi

            if ! docker compose version &> /dev/null; then
              echo "⚠️ Docker Compose Plugin no encontrado. Instalando..."
              sudo apt-get install -y docker-compose
            else
              echo "✅ Docker Compose ya instalado."
            fi

            # Ir al directorio del proyecto
            cd /home/${{ secrets.USER_UBUNTU }}/mysql-deploy/DB/MySQL

            # Limpiar contenedores antiguos
            CONTAINERS=$(sudo docker ps -a --filter "name=mysql" -q)
            if [ -n "$CONTAINERS" ]; then
              echo "🧹 Deteniendo contenedores MySQL existentes..."
              sudo docker stop $CONTAINERS || true
              echo "🗑️ Eliminando contenedores MySQL existentes..."
              sudo docker rm $CONTAINERS || true
            else
              echo "✅ No se encontraron contenedores MySQL activos."
            fi

            # Despliegue
            sudo docker compose down || true

            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD \
            MYSQL_DATABASE=$MYSQL_DATABASE \
            MYSQL_USER=$MYSQL_USER \
            MYSQL_PASSWORD=$MYSQL_PASSWORD \
            MYSQL_PORT=$MYSQL_PORT \
            sudo -E docker compose up -d

            echo "📦 Verificando contenedor MySQL..."
            sudo docker ps --filter "name=mysql"
