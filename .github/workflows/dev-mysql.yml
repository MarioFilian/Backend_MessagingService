name: 🧪 Dev · MySQL

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/MySQL/**'
      - '.github/workflows/dev-mysql.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/MySQL/**'
      - '.github/workflows/dev-mysql.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_PORT: ${{ secrets.PORT_MYSQL1 }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 📁 Ensure target directory on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/mysql-deploy

      - name: 📤 Copy MySQL files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          source: "DB/MySQL/docker-compose.yml"
          target: /home/${{ secrets.EC2_USER }}/mysql-deploy
          debug: true

      - name: 🚀 Deploy MySQL on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          envs: MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_PORT
          script: |
            if ! command -v docker &> /dev/null; then
              echo "📦 Instalando Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            else
              echo "✅ Docker ya está instalado."
            fi

            if ! docker compose version &> /dev/null; then
              echo "🔧 Instalando Docker Compose plugin..."
              sudo apt-get install -y docker-compose-plugin || sudo apt-get install -y docker-compose
            else
              echo "✅ Docker Compose ya está instalado."
            fi

            cd /home/${{ secrets.EC2_USER }}/mysql-deploy/DB/MySQL || cd /home/${{ secrets.EC2_USER }}/mysql-deploy

            CONTAINERS=$(sudo docker ps -a -q --filter "name=mysql")
            if [ -n "$CONTAINERS" ]; then
              echo "🛑 Deteniendo contenedores antiguos..."
              sudo docker stop $CONTAINERS || true
              echo "🧽 Eliminando contenedores antiguos..."
              sudo docker rm $CONTAINERS || true
            else
              echo "✅ No hay contenedores antiguos activos."
            fi

            sudo docker compose down || true

            echo "🚀 Desplegando contenedor MySQL..."
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD \
            MYSQL_DATABASE=$MYSQL_DATABASE \
            MYSQL_PORT=$MYSQL_PORT \
            sudo -E docker-compose up -d

            echo "🔍 Contenedores activos:"
            sudo docker ps --filter "name=mysql"
