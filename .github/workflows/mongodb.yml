name: Deploy MongoDB

on:
  pull_request:
    branches: [main]
    paths:
      - 'DB/MongoDB/docker-compose.yml'
      - 'DB/MongoDB/init-mongo.template.js'
      - '.github/workflows/mongodb.yml'

  push:
    branches: [QA, development]
    paths:
      - 'DB/MongoDB/docker-compose.yml'
      - 'DB/MongoDB/init-mongo.template.js'
      - '.github/workflows/mongodb.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Generate init-mongo.js
        run: |
          envsubst < DB/MongoDB/init-mongo.template.js > DB/MongoDB/init-mongo.js

      - name: List files for verification
        run: |
          echo "Verifying files in DB/MongoDB"
          ls -lh DB/MongoDB

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MONGO_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            mkdir -p /home/${{ secrets.USER_UBUNTU }}/mongo-deploy

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MONGO_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          source: "DB/MongoDB/docker-compose.yml,DB/MongoDB/init-mongo.js"
          target: /home/${{ secrets.USER_UBUNTU }}/mongo-deploy
          debug: true

      - name: Debug EC2 filesystem before deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MONGO_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            echo "Home dir: $(pwd)"
            echo "Listing home directory contents:"
            ls -la
            echo "Listing /home/${{ secrets.USER_UBUNTU }}:"
            ls -la /home/${{ secrets.USER_UBUNTU }}
            echo "Checking if mongo-deploy exists:"
            ls -la /home/${{ secrets.USER_UBUNTU }}/mongo-deploy || echo "mongo-deploy does not exist"

      - name: Install Docker and Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MONGO_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            # Update and install Docker
            sudo apt-get update
            sudo apt-get install -y docker.io curl
            sudo systemctl start docker
            sudo systemctl enable docker

            # Add user to docker group (optional, for running docker without sudo)
            sudo usermod -aG docker $USER || true

            # Install Docker Compose
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            # Verify installations
            docker --version || echo "docker not found"
            docker-compose --version || echo "docker-compose not found"

      - name: SSH into EC2 and deploy MongoDB
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MONGO_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            cd /home/${{ secrets.USER_UBUNTU }}/mongo-deploy
            sudo docker-compose down || true
            sudo docker-compose up -d
            sudo docker ps
