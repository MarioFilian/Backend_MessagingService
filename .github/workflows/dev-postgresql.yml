# dev-postgresql.yml
name: 🧪 Dev · PostgreSQL

on:
  push:
    branches: [ "development" ]
    paths:
      - 'DB/PostgreSQL/**'
      - '.github/workflows/dev-postgresql.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'DB/PostgreSQL/**'
      - '.github/workflows/dev-postgresql.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.USER_POSTGRES }}
      POSTGRES_PASSWORD: ${{ secrets.PASS_DB }}
      POSTGRES_DB: ${{ secrets.DB_POSTGRES }}
      POSTGRES_PORT: ${{ secrets.PORT_POSTGRES1 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/postgres-deploy

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          source: "DB/PostgreSQL/docker-compose.yml"
          target: /home/${{ secrets.EC2_USER }}/postgres-deploy
          debug: true

      - name: Clean old containers on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/postgres-deploy
            CONTAINER_ID=$(sudo docker ps -a -q --filter "name=postgresql")
            if [ -n "$CONTAINER_ID" ]; then
              echo "🧹 Deteniendo y eliminando contenedor PostgreSQL existente..."
              sudo docker stop $CONTAINER_ID || true
              sudo docker rm $CONTAINER_ID || true
            else
              echo "✅ No hay contenedores PostgreSQL detenidos que limpiar."
            fi

      - name: SSH into EC2 and deploy PostgreSQL
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_PORT
          script: |
            # Verifica si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "🚀 Docker no encontrado. Instalando..."
              sudo apt-get update -y
              sudo apt-get install -y \
                  ca-certificates \
                  curl \
                  gnupg \
                  lsb-release

              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
                sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              echo "✅ Docker instalado con éxito."
            else
              echo "✅ Docker ya está instalado. Verificando docker compose..."
              if ! docker compose version &> /dev/null; then
                echo "⚠️ 'docker compose' no encontrado. Instalando plugin..."
                sudo apt-get install -y docker-compose-plugin
              else
                echo "✅ 'docker compose' ya está instalado."
              fi
            fi

            # Despliegue del servicio PostgreSQL
            cd /home/${{ secrets.EC2_USER }}/postgres-deploy/DB/PostgreSQL
            POSTGRES_USER=$POSTGRES_USER \
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            POSTGRES_DB=$POSTGRES_DB \
            POSTGRES_PORT=$POSTGRES_PORT \
            sudo -E docker-compose up -d

      - name: 🔍 Verify PostgreSQL container status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BD_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            echo "🧪 Verifying container status..."
            sudo docker ps --filter "name=postgresql"
            echo "✅ If the container appears above, PostgreSQL is running."
