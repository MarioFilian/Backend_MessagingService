# dev-login-service.yml
name: 🔧 Dev · Login Service

on:
  push:
    branches: [ "development" ]
    paths:
      - 'Auth/login-service/**'
      - '.github/workflows/dev-login-service.yml'

  pull_request:
    branches: [ "QA" ]
    paths:
      - 'Auth/login-service/**'
      - '.github/workflows/dev-login-service.yml'

jobs:
  ci:
    name: Continuous Integration - Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: Auth/login-service

      - name: Create temporary .env file for tests
        run: |
          cat <<EOF > Auth/login-service/.env
          JWT_SECRET=${{ secrets.LOGIN_SERVICE_JWT_SECRET_DEV_QA }}
          REDIS_HOST=${{ secrets.LOGIN_SERVICE_REDIS_HOST_DEV_QA }}
          REDIS_PORT=${{ secrets.LOGIN_SERVICE_REDIS_PORT_DEV_QA }}
          REDIS_PASSWORD=${{ secrets.LOGIN_SERVICE_REDIS_PASSWORD_DEV_QA }}
          DB_HOST=${{ secrets.LOGIN_SERVICE_DB_HOST_DEV_QA }}
          DB_PORT=${{ secrets.LOGIN_SERVICE_DB_PORT_DEV_QA }}
          DB_USERNAME=${{ secrets.LOGIN_SERVICE_DB_USERNAME_DEV_QA }}
          DB_PASSWORD=${{ secrets.LOGIN_SERVICE_DB_PASSWORD_DEV_QA }}
          DB_NAME=${{ secrets.LOGIN_SERVICE_DB_NAME_DEV_QA }}
          PORT=${{ secrets.LOGIN_SERVICE_PORT_DEV_QA }}
          EOF

      - name: Run tests
        run: npm test
        working-directory: Auth/login-service

      - name: Clean up temporary .env file
        run: rm -f Auth/login-service/.env

  cd:
    name: Continuous Deployment - Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: success()

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/login-service:latest
      CONTAINER_NAME: login-service
      REMOTE_HOST: ${{ secrets.LOGIN_SERVICE_EC2_HOST_DEV_QA }}
      REMOTE_USER: ${{ secrets.LOGIN_SERVICE_EC2_USER_DEV_QA }}
      SSH_KEY: ${{ secrets.LOGIN_SERVICE_EC2_SSH_KEY_DEV_QA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (production mode)
        run: npm ci --omit=dev
        working-directory: Auth/login-service

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build Auth/login-service/. --file Auth/login-service/Dockerfile \
            --tag $IMAGE_NAME
          docker push $IMAGE_NAME

      - name: Deploy to EC2 without creating .env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            fi

            echo "Cleaning old containers and images..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            sudo docker image prune -f

            echo "Pulling latest Docker image..."
            sudo docker pull $IMAGE_NAME

            echo "Running new container with env vars injected directly..."
            sudo docker run -d --name $CONTAINER_NAME \
              -p 3001:${{ secrets.LOGIN_SERVICE_PORT_DEV_QA }} \
              -e PORT=${{ secrets.LOGIN_SERVICE_PORT_DEV_QA }} \
              -e JWT_SECRET=${{ secrets.LOGIN_SERVICE_JWT_SECRET_DEV_QA }} \
              -e REDIS_HOST=${{ secrets.LOGIN_SERVICE_REDIS_HOST_DEV_QA }} \
              -e REDIS_PORT=${{ secrets.LOGIN_SERVICE_REDIS_PORT_DEV_QA }} \
              -e REDIS_PASSWORD=${{ secrets.LOGIN_SERVICE_REDIS_PASSWORD_DEV_QA }} \
              -e DB_HOST=${{ secrets.LOGIN_SERVICE_DB_HOST_DEV_QA }} \
              -e DB_PORT=${{ secrets.LOGIN_SERVICE_DB_PORT_DEV_QA }} \
              -e DB_USERNAME=${{ secrets.LOGIN_SERVICE_DB_USERNAME_DEV_QA }} \
              -e DB_PASSWORD=${{ secrets.LOGIN_SERVICE_DB_PASSWORD_DEV_QA }} \
              -e DB_NAME=${{ secrets.LOGIN_SERVICE_DB_NAME_DEV_QA }} \
              --restart unless-stopped \
              $IMAGE_NAME

            echo "Deployment finished successfully."
