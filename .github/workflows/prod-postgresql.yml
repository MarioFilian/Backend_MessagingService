# prod-postgresql.yml
name: 📦 Prod · PostgreSQL

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'DB/PostgreSQL/**'
      - '.github/workflows/prod-postgresql.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.POSTGRES_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            mkdir -p /home/${{ secrets.USER_UBUNTU }}/postgres-deploy

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.POSTGRES_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          source: "DB/PostgreSQL/docker-compose.yml"
          target: /home/${{ secrets.USER_UBUNTU }}/postgres-deploy
          debug: true

      - name: Clean old containers and volumes on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.POSTGRES_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            cd /home/${{ secrets.USER_UBUNTU }}/postgres-deploy
            sudo docker-compose down --volumes --remove-orphans || true
            sudo docker system prune -af --volumes || true

      - name: SSH into EC2 and deploy PostgreSQL
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.POSTGRES_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          script: |
            sudo apt update
            sudo apt install -y docker.io docker-compose
            cd /home/${{ secrets.USER_UBUNTU }}/postgres-deploy/DB/PostgreSQL
            POSTGRES_USER=$POSTGRES_USER \
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            POSTGRES_DB=$POSTGRES_DB \
            sudo -E docker-compose up -d

      - name: 🔍 Verify PostgreSQL container status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.POSTGRES_HOST }}
          username: ${{ secrets.USER_UBUNTU }}
          key: ${{ secrets.SSH_KEY_DB }}
          script: |
            echo "🧪 Verifying container status..."
            sudo docker ps --filter "name=postgresql"
            echo "✅ If the container appears above, PostgreSQL is running."
