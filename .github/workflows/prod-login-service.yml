# prod-login-service.yml
name: 🚀 Prod · Login Service

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Auth/login-service/**'
      - '.github/workflows/prod-login-service.yml'

jobs:

  cd:
    name: Continuous Deployment - Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: success()

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/login-service:latest
      CONTAINER_NAME: login-service
      REMOTE_HOST: ${{ secrets.LOGIN_SERVICE_EC2_HOST_PROD }}
      REMOTE_USER: ${{ secrets.LOGIN_SERVICE_EC2_USER_PROD }}
      SSH_KEY: ${{ secrets.LOGIN_SERVICE_EC2_SSH_KEY_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (production)
        run: npm ci --omit=dev
        working-directory: Auth/login-service

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build Auth/login-service/ --file Auth/login-service/Dockerfile \
            --tag $IMAGE_NAME
          docker push $IMAGE_NAME

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e

            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            fi

            echo "Stopping previous container (if any)..."
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "Cleaning up dangling images..."
            sudo docker image prune -f

            echo "Pulling latest image..."
            sudo docker pull $IMAGE_NAME

            echo "Starting container with env vars from GitHub secrets..."
            sudo docker run -d --name $CONTAINER_NAME \
              -p 3001:${{ secrets.LOGIN_SERVICE_PORT_PROD }} \
              -e PORT=${{ secrets.LOGIN_SERVICE_PORT_PROD }} \
              -e JWT_SECRET=${{ secrets.LOGIN_SERVICE_JWT_SECRET_PROD }} \
              -e REDIS_HOST=${{ secrets.LOGIN_SERVICE_REDIS_HOST_PROD }} \
              -e REDIS_PORT=${{ secrets.LOGIN_SERVICE_REDIS_PORT_PROD }} \
              -e REDIS_PASSWORD=${{ secrets.LOGIN_SERVICE_REDIS_PASSWORD_PROD }} \
              -e DB_HOST=${{ secrets.LOGIN_SERVICE_DB_HOST_PROD }} \
              -e DB_PORT=${{ secrets.LOGIN_SERVICE_DB_PORT_PROD }} \
              -e DB_USERNAME=${{ secrets.LOGIN_SERVICE_DB_USERNAME_PROD }} \
              -e DB_PASSWORD=${{ secrets.LOGIN_SERVICE_DB_PASSWORD_PROD }} \
              -e DB_NAME=${{ secrets.LOGIN_SERVICE_DB_NAME_PROD }} \
              --restart unless-stopped \
              $IMAGE_NAME

            echo "Deployment finished successfully."
