name: CI/CD for Profile Update Service

on:
  push:
    paths:
      - 'Users/profile-update-service/**'
      - '.github/workflows/profile-update.yml'
    branches: ["development"]
  pull_request:
    paths:
      - 'Users/profile-update-service/**'
      - '.github/workflows/profile-update.yml'
    branches: ["QA", "main"]

jobs:
  cd:
    name: 🚀 Build & Deploy Java Microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Users/profile-update-service

    steps:
      - name: 🗕️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📁 Generate .env file
        run: |
          cat <<EOF > .env
          DB_HOST=${{ secrets.POSTGRES_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USERNAME=${{ secrets.POSTGRES_USER }}
          DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME=${{ secrets.POSTGRES_DB }}
          PORT=${{ secrets.PORT_PROFILE_UPDATE }}
          HIBERNATE_DDL_AUTO=${{ secrets.HIBERNATE_DDL_AUTO }}
          SHOW_SQL=${{ secrets.SHOW_SQL }}
          HIBERNATE_DIALECT=${{ secrets.HIBERNATE_DIALECT }}
          EOF

      - name: 📆 Build with Maven
        run: mvn clean package -DskipTests

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_USERNAME }}/profile-update-service:${{ github.run_number }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/profile-update-service:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

          rm .env

      - name: 🔐 SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROFILE_UPDATE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "🚧 Docker no está instalado. Instalando Docker..."
              while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "🔒 Esperando que se libere el lock de apt..."
                sleep 5
              done
              sudo rm -f /var/lib/apt/lists/lock
              sudo rm -f /var/lib/dpkg/lock*
              sudo dpkg --configure -a
              sudo apt-get update
              sudo apt-get install -y \
                apt-transport-https \
                ca-certificates \
                curl \
                gnupg \
                software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
                sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] \
                https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            else
              echo "✅ Docker ya está instalado"
            fi

            echo "🐳 Desplegando contenedor..."
            cat <<EOF > .env
            DB_HOST=${{ secrets.POSTGRES_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.POSTGRES_USER }}
            DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_NAME=${{ secrets.POSTGRES_DB }}
            PORT=${{ secrets.PORT_PROFILE_UPDATE }}
            HIBERNATE_DDL_AUTO=${{ secrets.HIBERNATE_DDL_AUTO }}
            SHOW_SQL=${{ secrets.SHOW_SQL }}
            HIBERNATE_DIALECT=${{ secrets.HIBERNATE_DIALECT }}
            EOF

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest
            sudo docker stop profile-update-service || true
            sudo docker rm profile-update-service || true
            sudo docker run -d --name profile-update-service -p ${{ secrets.PORT_PROFILE_UPDATE }}:3009 \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/profile-update-service:latest

            rm .env
