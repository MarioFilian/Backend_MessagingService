# dev-registration-service.yml
name: 🔧 Dev · Registration Service

on:
  push:
    branches: ["development"]
    paths:
      - 'Auth/registration-service/**'
      - '.github/workflows/dev-registration-service.yml'

  pull_request:
    branches: ["QA"]
    paths:
      - 'Auth/registration-service/**'
      - '.github/workflows/dev-registration-service.yml'

jobs:
  test:
    name: ✅ CI · Test Spring Boot
    runs-on: ubuntu-latest

    env:
      APP_NAME: registration-service
      SERVER_PORT: ${{ secrets.PORT_LOGIN }}
      DB_HOST: ${{ secrets.EC2_BD_DEV }}
      DB_PORT: ${{ secrets.PORT_POSTGRES1 }}
      DB_NAME: ${{ secrets.DB_POSTGRES }}
      DB_USERNAME: ${{ secrets.USER_POSTGRES }}
      DB_PASSWORD: ${{ secrets.PASS_DB }}
      HIBERNATE_DDL_AUTO: ${{ secrets.HIBERNATE_DDL_AUTO }}
      SHOW_SQL: ${{ secrets.SHOW_SQL }}
      HIBERNATE_DIALECT: ${{ secrets.HIBERNATE_DIALECT }}
      LOGGING_LEVEL_HIBERNATE_SQL: ${{ secrets.LOGGING_LEVEL_HIBERNATE_SQL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
      JWT_REFRESH_EXPIRATION_MS: ${{ secrets.JWT_REFRESH_EXPIRATION_MS }}
      CORS_ALLOWED: ${{ secrets.CORS_ALLOWED }}
      HOST_REDIS: ${{ secrets.EC2_BD_DEV }}
      PORT_REDIS: ${{ secrets.PORT_REDIS1 }}
      PASS_REDIS: ${{ secrets.PASS_DB }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🧪 Run Tests with Maven
        run: mvn clean verify -f Auth/registration-service/pom.xml

  deploy:
    name: 🚀 CD · Deploy to EC2
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/registration-service
      CONTAINER_NAME: registration-service
      APP_NAME: registration-service
      SERVER_PORT: ${{ secrets.PORT_LOGIN }}
      DB_HOST: ${{ secrets.EC2_BD_DEV }}
      DB_PORT: ${{ secrets.PORT_POSTGRES1 }}
      DB_NAME: ${{ secrets.DB_POSTGRES }}
      DB_USERNAME: ${{ secrets.USER_POSTGRES }}
      DB_PASSWORD: ${{ secrets.PASS_DB }}
      HIBERNATE_DDL_AUTO: ${{ secrets.HIBERNATE_DDL_AUTO }}
      SHOW_SQL: ${{ secrets.SHOW_SQL }}
      HIBERNATE_DIALECT: ${{ secrets.HIBERNATE_DIALECT }}
      LOGGING_LEVEL_HIBERNATE_SQL: ${{ secrets.LOGGING_LEVEL_HIBERNATE_SQL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
      JWT_REFRESH_EXPIRATION_MS: ${{ secrets.JWT_REFRESH_EXPIRATION_MS }}
      CORS_ALLOWED: ${{ secrets.CORS_ALLOWED }}
      HOST_REDIS: ${{ secrets.EC2_BD_DEV }}
      PORT_REDIS: ${{ secrets.PORT_REDIS1 }}
      PASS_REDIS: ${{ secrets.PASS_DB }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Auth/registration-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest

      - name: 🚀 SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AUTH_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY_BD }}
          script: |
            set -e
            IMAGE=${{ secrets.DOCKER_USERNAME }}/registration-service:latest
            CONTAINER=registration-service

            echo "🔍 Checking Docker..."
            if ! command -v docker &> /dev/null; then
              echo "🔧 Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
            else
              echo "✅ Docker already installed."
            fi

            echo "📥 Pulling latest image..."
            sudo docker pull $IMAGE

            echo "🧹 Cleaning old container..."
            if sudo docker ps -a --format '{{.Names}}' | grep -q $CONTAINER; then
              sudo docker stop $CONTAINER || true
              sudo docker rm $CONTAINER || true
            fi

            echo "🚀 Starting new container..."
            sudo docker run -d --name $CONTAINER \
              -p ${{ env.SERVER_PORT }}:${{ env.SERVER_PORT }} \
              -e APP_NAME=${{ env.APP_NAME }} \
              -e SERVER_PORT=${{ env.SERVER_PORT }} \
              -e DB_HOST=${{ env.DB_HOST }} \
              -e DB_PORT=${{ env.DB_PORT }} \
              -e DB_NAME=${{ env.DB_NAME }} \
              -e DB_USERNAME=${{ env.DB_USERNAME }} \
              -e DB_PASSWORD=${{ env.DB_PASSWORD }} \
              -e HIBERNATE_DDL_AUTO=${{ env.HIBERNATE_DDL_AUTO }} \
              -e SHOW_SQL=${{ env.SHOW_SQL }} \
              -e HIBERNATE_DIALECT=${{ env.HIBERNATE_DIALECT }} \
              -e LOGGING_LEVEL_HIBERNATE_SQL=${{ env.LOGGING_LEVEL_HIBERNATE_SQL }} \
              -e JWT_SECRET=${{ env.JWT_SECRET }} \
              -e JWT_EXPIRATION_MS=${{ env.JWT_EXPIRATION_MS }} \
              -e JWT_REFRESH_EXPIRATION_MS=${{ env.JWT_REFRESH_EXPIRATION_MS }} \
              -e CORS_ALLOWED=${{ env.CORS_ALLOWED }} \
              -e HOST_REDIS=${{ env.HOST_REDIS }} \
              -e PORT_REDIS=${{ env.PORT_REDIS }} \
              -e PASS_REDIS=${{ env.PASS_REDIS }} \
              --restart unless-stopped \
              $IMAGE

            echo "✅ Deployment complete!"
